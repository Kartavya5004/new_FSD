<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Profile Searcher</title>

    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

    background: #f6f8fa;

    color: #1f2328;
}

.container {
    width: 90%;
    max-width: 1000px;

    margin: 50px auto;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}


/* Search */

.search-box {
    display: flex;

    max-width: 600px;

    margin: auto;

    gap: 10px;
}

.search-box input {
    flex: 1;

    padding: 12px;

    border: 1px solid #d0d7de;

    border-radius: 6px;

    font-size: 16px;

    outline: none;
}

.search-box input:focus {
    border-color: #0969da;
}

.search-box button {
    padding: 12px 20px;

    border: none;

    border-radius: 6px;

    background: #2da44e;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

.search-box button:hover {
    background: #218739;
}


/* Error */

#error {
    color: #cf222e;

    text-align: center;

    margin: 20px;
}


/* Profile */

.profile {
    margin-top: 40px;

    padding: 30px;

    background: white;

    border: 1px solid #d0d7de;

    border-radius: 10px;

    display: flex;

    gap: 30px;
}

.avatar {
    width: 180px;
    height: 180px;

    border-radius: 50%;
}

.profile-info {
    flex: 1;
}

.profile-info h2 {
    font-size: 28px;

    margin-bottom: 5px;
}

#login {
    color: #656d76;

    margin-bottom: 20px;
}

#bio {
    margin-bottom: 25px;

    line-height: 1.5;
}


/* Stats */

.stats {
    display: flex;

    gap: 25px;

    margin-bottom: 25px;
}

.stats span {
    color: #656d76;
}

.stats strong {
    color: #1f2328;
}

#githubLink {
    color: #0969da;

    text-decoration: none;

    font-weight: bold;
}


/* Repositories */

#repoHeading {
    margin-top: 40px;

    margin-bottom: 15px;
}

#repositories {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 15px;
}

.repo {
    background: white;

    border: 1px solid #d0d7de;

    border-radius: 8px;

    padding: 20px;
}

.repo h3 {
    color: #0969da;

    margin-bottom: 10px;
}

.repo p {
    color: #656d76;

    min-height: 45px;

    margin-bottom: 15px;
}

.repo-info {
    display: flex;

    gap: 20px;

    font-size: 13px;

    color: #656d76;
}


/* Utility */

.hidden {
    display: none;
}


/* Mobile */

@media (max-width: 700px) {

    .profile {
        flex-direction: column;

        align-items: center;

        text-align: center;
    }

    .stats {
        justify-content: center;

        flex-wrap: wrap;
    }

    #repositories {
        grid-template-columns: 1fr;
    }

    .search-box {
        flex-direction: column;
    }
}
     </style>
</head>

<body>

    <div class="container">

        <h1>GitHub Profile Searcher</h1>

        <div class="search-box">
            <input
                type="text"
                id="username"
                placeholder="Enter GitHub username"
            >

            <button id="searchBtn">
                Search
            </button>
        </div>

        <p id="error"></p>


        <!-- Profile -->
        <div id="profile" class="profile hidden">

            <img id="avatar" class="avatar">

            <div class="profile-info">

                <h2 id="name"></h2>

                <p id="login"></p>

                <p id="bio"></p>

                <div class="stats">

                    <span>
                        <strong id="followers"></strong>
                        Followers
                    </span>

                    <span>
                        <strong id="following"></strong>
                        Following
                    </span>

                    <span>
                        <strong id="repoCount"></strong>
                        Repositories
                    </span>

                </div>

                <a
                    id="githubLink"
                    target="_blank"
                >
                    View GitHub Profile
                </a>

            </div>

        </div>


        <!-- Repositories -->

        <h2 id="repoHeading" class="hidden">
            Repositories
        </h2>

        <div id="repositories"></div>

    </div>


    <script>const usernameInput = document.getElementById("username");
const searchBtn = document.getElementById("searchBtn");

const profile = document.getElementById("profile");
const repositories = document.getElementById("repositories");

const error = document.getElementById("error");
const repoHeading = document.getElementById("repoHeading");


searchBtn.addEventListener("click", searchUser);


usernameInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
        searchUser();
    }

});


async function searchUser() {

    const username = usernameInput.value.trim();

    if (username === "") {
        showError("Please enter a GitHub username");
        return;
    }

    error.textContent = "";

    profile.classList.add("hidden");
    repoHeading.classList.add("hidden");

    repositories.innerHTML = "Loading...";


    try {

        // Get profile
        const profileResponse = await fetch(
            `https://api.github.com/users/${username}`
        );


        if (!profileResponse.ok) {
            throw new Error("User not found");
        }


        const data = await profileResponse.json();


        // Profile data
        document.getElementById("avatar").src =
            data.avatar_url;

        document.getElementById("name").textContent =
            data.name || data.login;

        document.getElementById("login").textContent =
            "@" + data.login;

        document.getElementById("bio").textContent =
            data.bio || "No bio available";


        document.getElementById("followers").textContent =
            data.followers;

        document.getElementById("following").textContent =
            data.following;

        document.getElementById("repoCount").textContent =
            data.public_repos;


        document.getElementById("githubLink").href =
            data.html_url;


        profile.classList.remove("hidden");


        // Get repositories
        await getRepositories(username);

    }

    catch (err) {

        repositories.innerHTML = "";

        showError(err.message);

    }

}


async function getRepositories(username) {

    const response = await fetch(
        `https://api.github.com/users/${username}/repos?sort=updated&per_page=10`
    );


    if (!response.ok) {
        throw new Error("Could not load repositories");
    }


    const repos = await response.json();


    repositories.innerHTML = "";

    repoHeading.classList.remove("hidden");


    repos.forEach(repo => {

        const repoCard = document.createElement("div");

        repoCard.className = "repo";


        repoCard.innerHTML = `

            <h3>
                ${repo.name}
            </h3>

            <p>
                ${repo.description || "No description available"}
            </p>

            <div class="repo-info">

                <span>
                    ${repo.language || "Unknown"}
                </span>

                <span>
                    ⭐ ${repo.stargazers_count}
                </span>

                <span>
                    Forks: ${repo.forks_count}
                </span>

            </div>

        `;


        repositories.appendChild(repoCard);

    });

}


function showError(message) {

    error.textContent = message;

}

    </script>

</body>
</html>
